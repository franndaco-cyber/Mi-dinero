<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#193451"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mi Control"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Mi Control de Dinero</title><style>
:root{--n:#193451;--g:#c7a765;--bg:#f3f5f8;--ink:#172536;--mut:#697586;--line:#e0e6ed;--brown:#7b573b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:80px}header{background:var(--n);color:#fff;padding:18px 16px;position:sticky;top:0;z-index:2}header small{color:#d5deea;text-transform:uppercase;letter-spacing:.07em}header h1{margin:4px 0 0;font-size:22px}main{max-width:760px;margin:auto;padding:14px}.month{display:flex;gap:8px;margin-bottom:12px;align-items:center}.month select{flex:1}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;overflow-x:auto;padding:5px 3px calc(5px + env(safe-area-inset-bottom));z-index:4}nav button{background:transparent;color:#536174;flex:1;min-width:60px;padding:8px 2px;font-size:11px}nav button.active{background:#e9eef4;color:var(--n)}nav b{display:block;font-size:17px;margin-bottom:3px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:12px}.hero{background:linear-gradient(135deg,#193451,#294d70);color:white}.hero .muted{color:#d4dfeb}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.metric{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:11px;min-width:0}.hero .metric{background:#ffffff12;border-color:#ffffff24}.label{font-size:12px;color:var(--mut);margin-bottom:6px}.hero .label{color:#d4dfeb}.val{font-size:20px;font-weight:750;overflow-wrap:anywhere}.hero .val{color:white}h2{font-size:19px;margin:8px 0 12px}h3{font-size:15px;margin:0 0 10px}.muted,.small{color:var(--mut);font-size:12px;line-height:1.4}label{display:block;font-weight:650;font-size:13px;margin:10px 0 5px}input,select,textarea{width:100%;border:1px solid #cbd5df;border-radius:9px;background:white;padding:11px;font:inherit;color:var(--ink)}button{border:0;border-radius:9px;background:var(--n);color:white;font:inherit;font-weight:650;padding:10px 12px;cursor:pointer}button.secondary{background:#e9eef4;color:var(--n)}button.danger{background:#fff0ef;color:#b42318}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}.item{display:flex;gap:8px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}.item:last-child{border:0}.grow{flex:1;min-width:0}.amt{font-weight:750;white-space:nowrap}.pill{display:inline-block;border-radius:99px;padding:4px 7px;font-size:11px;background:#edf1f5;margin-top:5px}.green{background:#e1f4e9;color:#17683f}.orange{background:#fff0d8;color:#875313}.notice{background:#fff7e6;border:1px solid #f0d8a7;color:#79591d;border-radius:11px;padding:10px;font-size:12px;line-height:1.4;margin-bottom:12px}.line{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.line:last-child{border:0}.brown{border-top:4px solid var(--brown)}.empty{text-align:center;color:var(--mut);padding:18px}.hidden{display:none!important}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}nav{max-width:760px;left:50%;transform:translateX(-50%);border-radius:14px 14px 0 0}}
</style></head><body><header><small>Control personal · solo en este dispositivo</small><h1>Mi Control de Dinero</h1></header><main><div class="month"><label style="margin:0;align-self:center">Mes:</label><select id="month"></select><button class="secondary" id="today">Hoy</button></div><div id="view"></div></main><nav><button data-tab="home" class="active"><b>⌂</b>Inicio</button><button data-tab="income"><b>＋</b>Ingresos</button><button data-tab="dist"><b>▤</b>Distribución</button><button data-tab="book"><b>▣</b>Libro Marrón</button><button data-tab="report"><b>▥</b>Cierre</button></nav><script src="app.js"></script></body></html>
